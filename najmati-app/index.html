<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#e86aa8"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="نجمتي">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نجمتي الصغيرة ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6fb;--card:#fff;--tx:#3b2a4a;--mu:#8a7a99;--a:#e86aa8;--a2:#f9d3e6;--g:#f5b301;--pos:#2e9e6b;--neg:#e0803a;--bd:#f0dcea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-t=violet]{--bg:#f7f3ff;--a:#8a5cd6;--a2:#e4d8fa;--bd:#e2d8f3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#241a2e;--card:#33263f;--tx:#f5eaf8;--mu:#bfaed0;--bd:#4a3a5a;--a2:#4a3358}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,var(--a),#b58be8);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.3rem;flex:1}header small{opacity:.9;display:block;font-weight:400;font-size:.8rem}
nav{display:flex;gap:6px;padding:10px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
button,.b{font:inherit;border:0;border-radius:14px;padding:10px 14px;background:var(--a);color:#fff;cursor:pointer;min-height:44px;font-weight:700;white-space:nowrap}
button.s{background:var(--a2);color:var(--tx)}button.p{background:var(--pos)}button.n{background:var(--neg)}button.d{background:#d9534f}
nav button{background:var(--a2);color:var(--tx)}nav button.on{background:var(--a);color:#fff}
main{padding:12px;max-width:1000px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px #b58be822}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{cursor:pointer;text-align:center;padding:12px 8px}.st:active{transform:scale(.97)}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--a2);display:inline-flex;align-items:center;justify-content:center;font-size:2rem;border:3px solid var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.sp{flex:1!important}
input,select,textarea{font:inherit;padding:9px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
textarea{width:100%}input[type=text],input[type=search]{min-width:0}
.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi div{flex:1;min-width:90px;background:var(--a2);border-radius:14px;padding:8px;text-align:center}.kpi b{display:block;font-size:1.4rem}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
.wrap{overflow-x:auto}.pos{color:var(--pos)}.neg{color:var(--neg)}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:20}
#m.o{display:flex}#m>div{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px}
.bh{display:flex;justify-content:space-between;width:100%;text-align:right;background:var(--bg);color:var(--tx);border:2px solid var(--bd);margin-bottom:6px}
.bh.sel{border-color:var(--a);background:var(--a2)}
.bar{display:flex;align-items:flex-end;gap:8px;height:110px}.bar div{flex:1;text-align:center;font-size:.8rem}.bar i{display:block;background:var(--g);border-radius:8px 8px 0 0;min-height:2px}
.fx{position:fixed;font-size:3rem;pointer-events:none;animation:up 1.1s forwards;z-index:30}
@keyframes up{to{transform:translateY(-160px) scale(1.6);opacity:0}}
#t{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:40}
@media print{header,nav,.np,#m,#t{display:none!important}body{background:#fff;color:#000}.c{box-shadow:none}}

#adm{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;z-index:60;width:40px;height:40px;border-radius:50%;padding:0;font-size:20px;background:var(--card);border:1px solid var(--bd);box-shadow:0 2px 8px #0002;min-height:0}
#bn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:8px;z-index:60;font-size:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:3px 10px;display:none}
body.pub [onclick*="editS("],body.pub [onclick*="delS("],body.pub [onclick*="addS("],body.pub [onclick*="waRep("],body.pub #app label:has(input[type=file]),body.pub .c:has(textarea[oninput*=".note"]){display:none!important}
body.ro [onclick*="rec("],body.ro [onclick*="editL("],body.ro [onclick*="delL("],body.ro [onclick*="undo("]{display:none!important}

#pr{position:fixed;inset:0;z-index:9000;background:#fff;color:#000;overflow:auto}
#pr .pq{text-align:center;padding:24px;page-break-after:always}#pr .qb{width:min(70vw,420px);margin:16px auto}
#pr .pc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px}#pr .cd{border:1px dashed #999;border-radius:12px;padding:8px;text-align:center;break-inside:avoid}
#pr .qs{width:120px;margin:8px auto}#pr small{display:block;color:#555;font-size:11px}
@media print{body>*:not(#pr){display:none!important}#pr{position:static;overflow:visible}#pr .np{display:none}}
</style></head><body>
